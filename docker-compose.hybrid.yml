services:
  # Next.js Frontend + API Routes
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare-nextjs
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - API_PORT=3001
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev:next
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  # Express Backend API
  express:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare-express
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - API_PORT=3001
      - FRONTEND_URL=http://localhost:3000
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - CHROMA_URL=http://chromadb:8000
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev:api
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  # Prisma Studio
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare-prisma-studio
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
    volumes:
      - .:/app
      - /app/node_modules
    command: npx prisma studio --schema=./src/db/prisma/schema.prisma
    profiles:
      - dev

  # Redis
  redis:
    image: redis:7-alpine
    container_name: healthcare-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ChromaDB
  chromadb:
    image: chromadb/chroma:latest
    container_name: healthcare-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Nginx Reverse Proxy (optional - for unified access)
  nginx:
    image: nginx:alpine
    container_name: healthcare-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs
      - express
    profiles:
      - production
    restart: unless-stopped

volumes:
  redis_data:
  chromadb_data:


networks:
  default:
    name: healthcare-network
